    <!-- JavaScript -->

    <script>

        /*
            ==============================
            YOUR DATE OF BIRTH
            ==============================

            Change this date to your real
            date of birth.

            Format:
            YYYY-MM-DD

            Example:
            2006-10-15
        */

        const birthDate = new Date("2006-6-2");


        /*
            Calculate Age
        */

        function calculateAge(today) {

            let age =
                today.getFullYear() -
                birthDate.getFullYear();

            const birthdayThisYear = new Date(
                today.getFullYear(),
                birthDate.getMonth(),
                birthDate.getDate()
            );

            if (today < birthdayThisYear) {
                age--;
            }

            return age;
        }


        /*
            Get Next Birthday
        */

        function getNextBirthday(today) {

            let nextBirthday = new Date(
                today.getFullYear(),
                birthDate.getMonth(),
                birthDate.getDate(),
                0,
                0,
                0
            );


            /*
                If birthday already passed,
                use next year.
            */

            if (nextBirthday <= today) {

                nextBirthday = new Date(
                    today.getFullYear() + 1,
                    birthDate.getMonth(),
                    birthDate.getDate(),
                    0,
                    0,
                    0
                );

            }

            return nextBirthday;
        }


        /*
            Format Birthday
        */

        function formatBirthday() {

            const options = {
                day: "numeric",
                month: "long"
            };

            return birthDate.toLocaleDateString(
                "en-US",
                options
            );
        }


        /*
            Calculate Countdown
        */

        function updateWebsite() {

            const today = new Date();

            /*
                Update Age
            */

            const age = calculateAge(today);

            document.getElementById("age").textContent =
                "🎂 " + age + " years old";


            /*
                Update Birthday
            */

            document.getElementById("birthday").textContent =
                "📅 Birthday: " + formatBirthday();


            /*
                Get Next Birthday
            */

            const nextBirthday =
                getNextBirthday(today);


            /*
                Check Birthday Today
            */

            const birthdayMonth =
                today.getMonth() === birthDate.getMonth();

            const birthdayDay =
                today.getDate() === birthDate.getDate();


            if (birthdayMonth && birthdayDay) {

                document.getElementById("countdown").textContent =
                    "🎉 Happy Birthday! 🎂";

                return;
            }


            /*
                Calculate Time Difference
            */

            let difference =
                nextBirthday.getTime() -
                today.getTime();


            /*
                Calculate Days
            */

            const days =
                Math.floor(
                    difference /
                    (1000 * 60 * 60 * 24)
                );

            difference =
                difference %
                (1000 * 60 * 60 * 24);


            /*
                Calculate Hours
            */

            const hours =
                Math.floor(
                    difference /
                    (1000 * 60 * 60)
                );

            difference =
                difference %
                (1000 * 60 * 60);


            /*
                Calculate Minutes
            */

            const minutes =
                Math.floor(
                    difference /
                    (1000 * 60)
                );

            difference =
                difference %
                (1000 * 60);


            /*
                Calculate Seconds
            */

            const seconds =
                Math.floor(
                    difference / 1000
                );


            /*
                Display Countdown
            */

            document.getElementById("countdown").textContent =
                "⏳ " +
                days + " days " +
                String(hours).padStart(2, "0") + " hours " +
                String(minutes).padStart(2, "0") + " minutes " +
                String(seconds).padStart(2, "0") + " seconds";


        }


        /*
            Run immediately
        */

        updateWebsite();


        /*
            Update every second
        */

        setInterval(
            updateWebsite,
            1000
        );

    </script>
