<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abdo - Personal Website</title>

    <style>

        /* ===== General Page ===== */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: #333;
        }


        /* ===== Main Container ===== */

        .container {
            width: 80%;
            max-width: 700px;
            margin: 60px auto;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }


        /* ===== Main Title ===== */

        h1 {
            color: #2c3e50;
            font-size: 40px;
            margin-bottom: 10px;
        }


        /* ===== Section Titles ===== */

        h2 {
            color: #3498db;
            margin-top: 30px;
        }


        /* ===== Paragraphs ===== */

        p {
            font-size: 18px;
            line-height: 1.6;
        }


        /* ===== My Picture ===== */

        img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #3498db;
            margin: 20px 0;
        }


        /* ===== Social Media Buttons ===== */

        a {
            display: inline-block;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            margin: 5px;
            transition: 0.3s;
        }


        /* Facebook */

        a.facebook {
            background-color: #1877f2;
        }


        /* Instagram */

        a.instagram {
            background-color: #e1306c;
        }


        /* WhatsApp */

        a.whatsapp {
            background-color: #25d366;
        }


        /* ===== Hover Effect ===== */

        a:hover {
            transform: scale(1.05);
            opacity: 0.85;
        }


        /* ===== Footer ===== */

        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }


        /* ===== Mobile ===== */

        @media (max-width: 600px) {

            .container {
                width: 75%;
                padding: 25px;
            }

            h1 {
                font-size: 30px;
            }

            img {
                width: 200px;
                height: 200px;
            }

            a {
                display: block;
                margin: 10px auto;
                width: 180px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <!-- Main Title -->

        <h1>Hello, I'm Abdo 👋</h1>

        <p>
            Welcome to my personal website.
        </p>


        <!-- About Me -->

        <h2>About Me</h2>

        <p>
            My name is Abdo.
        </p>

        <p>
            I am 20 years old.
        </p>

        <p>
            I study in ERU.
        </p>


        <!-- My Picture -->

        <h2>My Picture</h2>

        <img src="my img.jpeg" alt="Abdo's picture">


        <!-- Social Media -->

        <h2>My Social Media</h2>


        <!-- Facebook -->

        <a class="facebook"
           href="https://www.facebook.com/abdo.ahmed.422090/"
           target="_blank">

            Facebook

        </a>


        <!-- Instagram -->

        <a class="instagram"
           href="https://www.instagram.com/YOUR_USERNAME/"
           target="_blank">

            Instagram

        </a>


        <!-- WhatsApp -->

        <a class="whatsapp"
           href="https://wa.me/YOUR_PHONE_NUMBER"
           target="_blank">

            WhatsApp

        </a>


        <!-- Footer -->

        <div class="footer">

            <p>
                © 2026 Abdo. All Rights Reserved.
            </p>

        </div>

    </div>

</body>

</html>
